<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地圖射飛鏢</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        #controls {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            max-height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        #controls h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.2rem;
            color: #4CAF50;
            width: 100%;
        }

        #controls div {
            margin-bottom: 5px;
            width: 48%;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #1976D2;
        }

        #power-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        #power-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4CAF50, #ffeb3b, #f44336);
            transition: width 0.1s;
        }

        #result-panel {
            pointer-events: auto;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        #result-panel.hidden {
            display: none;
        }

        #result-panel h3 {
            margin-top: 0;
            color: #4CAF50;
            font-size: 2rem;
        }

        #result-link {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #reset-btn {
            background: #f44336;
        }

        #reset-btn:hover {
            background: #d32f2f;
        }

        #mobile-shoot-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(244, 67, 54, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            pointer-events: auto;
            border: 4px solid #fff;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }
        #mobile-shoot-btn:active {
            background: rgba(211, 47, 47, 1);
            transform: scale(0.95);
        }

        /* Map Modal Styles */
        #map-modal {
            pointer-events: auto;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #map-modal.hidden {
            display: none;
        }

        #map-modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            color: black;
            position: relative;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            height: 500px;
            margin: 15px 0;
            border: 2px solid #ccc;
        }

        #leaflet-map {
            width: 100%;
            height: 100%;
        }

        #map-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid red;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }
        
        #map-crosshair::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 2000;
        }
        #loading-overlay.hidden { display: none; }

    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair">+</div>
        <div id="controls">
            <h2>地圖射飛鏢</h2>
            <div>
                <button id="open-map-btn">📍 自訂地圖範圍</button>
            </div>
            <div>
                <label>距離：</label>
                <select id="distance-select">
                    <option value="2.37">標準距離 (2.37m)</option>
                    <option value="5">5公尺</option>
                    <option value="10">10公尺</option>
                    <option value="custom">自訂...</option>
                </select>
                <div id="custom-distance-container" class="hidden" style="margin-top: 10px;">
                    <label>輸入距離 (公尺)：</label>
                    <input type="number" id="custom-distance-input" min="1" max="100" value="15" style="width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box;">
                </div>
            </div>
            <div>
                <label>模式：</label>
                <select id="mode-select">
                    <option value="single">單發模式</option>
                    <option value="multi">三發區域模式</option>
                </select>
            </div>
            <div>
                <label>標靶移動：</label>
                <select id="movement-select">
                    <option value="none">靜止</option>
                    <option value="horizontal">左右移動</option>
                    <option value="vertical">上下移動</option>
                    <option value="circle">圓形移動</option>
                </select>
            </div>
            <div id="speed-container" class="hidden">
                <label>移動速度：<span id="speed-display">1.0</span></label>
                <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1" style="width:100%;">
            </div>
            <div id="power-bar-container" style="width: 100%;">
                <div id="power-bar"></div>
            </div>
        </div>
        <div id="result-panel" class="hidden">
            <h3>射中位置！</h3>
            <p id="result-text"></p>
            <a id="result-link" href="#" target="_blank">在 Google Maps 中開啟</a>
            <button id="reset-btn">重新開始</button>
        </div>
        <div id="mobile-shoot-btn">🎯 射擊</div>
    </div>

    <!-- Map Selection Modal -->
    <div id="map-modal" class="hidden">
        <div id="map-modal-content">
            <h2 style="margin-top: 0;">選擇地圖標靶中心點</h2>
            <p>拖曳並縮放地圖，將紅色的十字對準您想要的標靶中心。</p>
            <div id="map-wrapper">
                <div id="leaflet-map"></div>
                <div id="map-crosshair"></div>
            </div>
            <div class="modal-buttons">
                <button id="cancel-map-btn" style="background: #999;">取消</button>
                <button id="confirm-map-btn">確認選擇並更新標靶</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="hidden">下載地圖圖資中，請稍候...</div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    <script src="map_data.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        
        const initialMapBase64 = window.mapBase64;

        let scene, camera, renderer, clock;
        let world;
        let darts = [];
        let targetMesh, targetBody;
        let isMouseDown = false;
        let power = 0;
        const MAX_POWER = 50;
        let hitPoints = [];
        let gameMode = 'single';
        let currentDistance = 2.37;
        let leafletMap = null;
        let targetMovement = 'none';
        let targetSpeed = 1.0;

        const powerBar = document.getElementById('power-bar');
        const distanceSelect = document.getElementById('distance-select');
        const customDistanceContainer = document.getElementById('custom-distance-container');
        const customDistanceInput = document.getElementById('custom-distance-input');
        const modeSelect = document.getElementById('mode-select');
        const movementSelect = document.getElementById('movement-select');
        const speedContainer = document.getElementById('speed-container');
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const resultPanel = document.getElementById('result-panel');
        const resultText = document.getElementById('result-text');
        const resultLink = document.getElementById('result-link');
        const resetBtn = document.getElementById('reset-btn');
        const mapModal = document.getElementById('map-modal');
        const shootBtn = document.getElementById('mobile-shoot-btn');
        const openMapBtn = document.getElementById('open-map-btn');
        const cancelMapBtn = document.getElementById('cancel-map-btn');
        const confirmMapBtn = document.getElementById('confirm-map-btn');
        const loadingOverlay = document.getElementById('loading-overlay');

        // 儲存目前標靶的邊界，預設值會被初始圖片或自訂地圖覆蓋
        let mapBounds = {
            minLat: 24.965, maxLat: 24.971,
            minLng: 121.191, maxLng: 121.197
        };

        init();
        animate();

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            setCameraDistance(currentDistance);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            world = new CANNON.World({
                gravity: new CANNON.Vec3(0, -9.82, 0),
            });

            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            const floorBody = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Plane(),
            });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            createTarget();
            
            if (initialMapBase64) {
                // 如果有離線備用圖片，先載入它
                const texture = new THREE.TextureLoader().load(initialMapBase64);
                texture.colorSpace = THREE.SRGBColorSpace;
                targetMesh.material.map = texture;
                targetMesh.material.needsUpdate = true;
            } else {
                // 沒有的話就立刻生成預設地圖 (中央大學)
                updateTargetMap(24.9682, 121.1945, 16);
            }

            window.addEventListener('resize', onWindowResize);
            
            distanceSelect.addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    customDistanceContainer.classList.remove('hidden');
                    setCameraDistance(parseFloat(customDistanceInput.value));
                } else {
                    customDistanceContainer.classList.add('hidden');
                    setCameraDistance(parseFloat(e.target.value));
                }
            });

            customDistanceInput.addEventListener('input', (e) => {
                if (distanceSelect.value === 'custom') {
                    const val = parseFloat(e.target.value);
                    if (!isNaN(val) && val > 0) {
                        setCameraDistance(val);
                    }
                }
            });

            modeSelect.addEventListener('change', (e) => { gameMode = e.target.value; resetGame(); });
            
            movementSelect.addEventListener('change', (e) => {
                targetMovement = e.target.value;
                if (targetMovement === 'none') {
                    speedContainer.classList.add('hidden');
                    targetBody.position.set(0, 2, 0);
                    targetMesh.position.copy(targetBody.position);
                } else {
                    speedContainer.classList.remove('hidden');
                }
            });

            speedSlider.addEventListener('input', (e) => {
                targetSpeed = parseFloat(e.target.value);
                speedDisplay.innerText = targetSpeed.toFixed(1);
            });

            resetBtn.addEventListener('click', resetGame);

            // 移除舊的 pointer lock 邏輯，改為綁定觸控事件
            
            // 觸控發射邏輯
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!resultPanel.classList.contains('hidden')) return;
                isMouseDown = true;
                power = 0;
            }, { passive: false });

            shootBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isMouseDown) return;
                isMouseDown = false;
                shootDart(power);
                power = 0;
                powerBar.style.width = '0%';
            }, { passive: false });
            
            // 觸控瞄準邏輯
            let isDragging = false;
            let previousTouch = null;

            renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: false });

            renderer.domElement.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const movementX = touch.clientX - previousTouch.x;
                    const movementY = touch.clientY - previousTouch.y;
                    
                    yaw -= movementX * 0.005;
                    pitch -= movementY * 0.005;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                    
                    previousTouch = { x: touch.clientX, y: touch.clientY };
                }
            }, { passive: false });

            renderer.domElement.addEventListener('touchend', (e) => {
                isDragging = false;
            }, { passive: false });
            
            // Map Modal Logic
            openMapBtn.addEventListener('click', () => {
                document.exitPointerLock();
                mapModal.classList.remove('hidden');
                if (!leafletMap) {
                    leafletMap = L.map('leaflet-map').setView([24.9682, 121.1945], 16);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: 'Tiles &copy; Esri'
                    }).addTo(leafletMap);
                }
                setTimeout(() => leafletMap.invalidateSize(), 100);
            });
            
            cancelMapBtn.addEventListener('click', () => {
                mapModal.classList.add('hidden');
            });
            
            confirmMapBtn.addEventListener('click', () => {
                mapModal.classList.add('hidden');
                const center = leafletMap.getCenter();
                const zoom = leafletMap.getZoom();
                updateTargetMap(center.lat, center.lng, zoom);
                resetGame();
            });
        }

        function createTarget() {
            const targetSize = 3;
            const geometry = new THREE.PlaneGeometry(targetSize, targetSize);
            const material = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide });
            targetMesh = new THREE.Mesh(geometry, material);
            targetMesh.position.set(0, 2, 0);
            targetMesh.receiveShadow = true;
            scene.add(targetMesh);

            targetBody = new CANNON.Body({
                type: CANNON.Body.KINEMATIC,
                shape: new CANNON.Box(new CANNON.Vec3(targetSize/2, targetSize/2, 0.1)),
                position: new CANNON.Vec3(0, 2, 0)
            });
            world.addBody(targetBody);
        }

        // --- 地圖圖塊拼貼邏輯 ---
        function lon2tile(lon,zoom) { return (Math.floor((lon+180)/360*Math.pow(2,zoom))); }
        function lat2tile(lat,zoom) { return (Math.floor((1-Math.log(Math.tan(lat*Math.PI/180) + 1/Math.cos(lat*Math.PI/180))/Math.PI)/2 *Math.pow(2,zoom))); }
        function tile2lon(x,z) { return (x/Math.pow(2,z)*360-180); }
        function tile2lat(y,z) { 
            const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
            return (180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))));
        }

        async function updateTargetMap(centerLat, centerLng, zoom) {
            loadingOverlay.classList.remove('hidden');
            try {
                // 以選定點為中心，抓取 4x4 的圖塊陣列 (每圖塊 256x256，總共 1024x1024)
                const centerTileX = lon2tile(centerLng, zoom);
                const centerTileY = lat2tile(centerLat, zoom);
                
                const startX = centerTileX - 1;
                const startY = centerTileY - 1;
                
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                
                const promises = [];
                for(let i=0; i<4; i++) {
                    for(let j=0; j<4; j++) {
                        const x = startX + i;
                        const y = startY + j;
                        // Esri 的 API 是 {z}/{y}/{x}
                        const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${zoom}/${y}/${x}`;
                        
                        promises.push(new Promise((resolve) => {
                            const img = new Image();
                            img.crossOrigin = 'Anonymous';
                            img.onload = () => {
                                ctx.drawImage(img, i*256, j*256, 256, 256);
                                resolve();
                            };
                            img.onerror = resolve; // 忽略錯誤
                            img.src = url;
                        }));
                    }
                }
                
                await Promise.all(promises);
                
                // 更新材質
                const texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                targetMesh.material.map = texture;
                targetMesh.material.needsUpdate = true;
                
                // 更新經緯度範圍 (Canvas的左上角到右下角)
                // Y軸(Lat)是上到下，所以 minLat 實際上是右下角的緯度
                mapBounds.maxLat = tile2lat(startY, zoom);
                mapBounds.minLat = tile2lat(startY + 4, zoom);
                mapBounds.minLng = tile2lon(startX, zoom);
                mapBounds.maxLng = tile2lon(startX + 4, zoom);
                
            } catch (e) {
                console.error("Failed to load map texture", e);
                alert("下載地圖失敗，請檢查網路連線。");
            }
            loadingOverlay.classList.add('hidden');
        }

        function setCameraDistance(distance) {
            currentDistance = distance;
            camera.position.set(0, 1.6, distance);
            camera.lookAt(0, 2, 0);
        }

        let pitch = 0;
        let yaw = 0;

        function shootDart(shootPower) {
            const geometry = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
            geometry.rotateX(Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const dartMesh = new THREE.Mesh(geometry, material);
            
            dartMesh.position.copy(camera.position);
            dartMesh.quaternion.copy(camera.quaternion);
            scene.add(dartMesh);

            const shape = new CANNON.Cylinder(0.02, 0.02, 0.2, 8);
            const dartBody = new CANNON.Body({
                mass: 0.1,
                position: new CANNON.Vec3(camera.position.x, camera.position.y, camera.position.z),
                shape: shape
            });
            
            dartBody.quaternion.copy(camera.quaternion);

            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            direction.normalize();

            const speed = 10 + (shootPower / MAX_POWER) * 20;
            dartBody.velocity.set(direction.x * speed, direction.y * speed, direction.z * speed);
            dartBody.angularVelocity.set(0, 0, 5);

            world.addBody(dartBody);
            darts.push({ mesh: dartMesh, body: dartBody, hasHit: false });
        }

        function calculateHitCoordinate(intersectionPoint) {
            targetMesh.updateMatrixWorld();
            const localPoint = targetMesh.worldToLocal(intersectionPoint.clone());
            const u = (localPoint.x + 1.5) / 3;
            const v = (localPoint.y + 1.5) / 3;
            
            // 修正座標對應：v = 0 是標靶下方 (minLat/南方), v = 1 是上方 (maxLat/北方)
            const lat = mapBounds.minLat + (mapBounds.maxLat - mapBounds.minLat) * v;
            const lng = mapBounds.minLng + (mapBounds.maxLng - mapBounds.minLng) * u;
            return { lat, lng };
        }

        function showResult(coordsList) {
            document.exitPointerLock();
            resultPanel.classList.remove('hidden');
            
            if (gameMode === 'single') {
                const coord = coordsList[0];
                const url = `https://www.google.com/maps/search/?api=1&query=${coord.lat},${coord.lng}`;
                resultText.innerText = `經度: ${coord.lng.toFixed(5)}\n緯度: ${coord.lat.toFixed(5)}`;
                resultLink.href = url;
            } else {
                const centerLat = coordsList.reduce((sum, c) => sum + c.lat, 0) / 3;
                const centerLng = coordsList.reduce((sum, c) => sum + c.lng, 0) / 3;
                
                let text = "已形成區域！\n";
                coordsList.forEach((c, index) => {
                    text += `第 ${index + 1} 發: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}\n`;
                });
                text += `\n中心點:\n經度: ${centerLng.toFixed(5)}\n緯度: ${centerLat.toFixed(5)}`;
                
                resultText.innerText = text;
                
                const url = `https://www.google.com/maps/search/?api=1&query=${centerLat},${centerLng}`;
                resultLink.href = url;
            }
        }

        function resetGame() {
            darts.forEach(dart => {
                if (dart.mesh.parent) {
                    dart.mesh.parent.remove(dart.mesh);
                }
                world.removeBody(dart.body);
            });
            darts = [];
            hitPoints = [];
            resultPanel.classList.add('hidden');
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (isMouseDown) {
                power = Math.min(power + 1, MAX_POWER);
                powerBar.style.width = `${(power / MAX_POWER) * 100}%`;
            }
            world.step(1 / 60);

            // 處理標靶移動
            if (targetMovement !== 'none') {
                const amplitude = 1.2;
                let x = 0;
                let y = 2;
                if (targetMovement === 'horizontal') {
                    x = Math.sin(time * targetSpeed) * amplitude;
                } else if (targetMovement === 'vertical') {
                    y = 2 + Math.sin(time * targetSpeed) * amplitude;
                } else if (targetMovement === 'circle') {
                    x = Math.sin(time * targetSpeed) * amplitude;
                    y = 2 + Math.cos(time * targetSpeed) * amplitude;
                }
                targetBody.position.set(x, y, 0);
                targetMesh.position.copy(targetBody.position);
            }

            const raycaster = new THREE.Raycaster();
            darts.forEach(dart => {
                if (dart.hasHit) return;

                dart.mesh.position.copy(dart.body.position);
                dart.mesh.quaternion.copy(dart.body.quaternion);
                
                const direction = new THREE.Vector3().copy(dart.body.velocity).normalize();
                raycaster.set(dart.mesh.position, direction);
                
                const intersects = raycaster.intersectObject(targetMesh);
                if (intersects.length > 0 && intersects[0].distance < 0.3) {
                    dart.hasHit = true;
                    
                    // 讓飛鏢插在標靶上並跟著移動
                    targetMesh.attach(dart.mesh);
                    dart.mesh.position.copy(targetMesh.worldToLocal(intersects[0].point.clone()));
                    
                    // 從物理世界移除飛鏢
                    world.removeBody(dart.body);
                    
                    const coords = calculateHitCoordinate(intersects[0].point);
                    hitPoints.push(coords);
                    
                    if (gameMode === 'single') {
                        showResult(hitPoints);
                    } else if (gameMode === 'multi' && hitPoints.length >= 3) {
                        showResult(hitPoints);
                    }
                }
                if (dart.mesh.position.y < 0) {
                    dart.hasHit = true;
                }
            });
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
