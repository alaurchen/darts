<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地圖射飛鏢</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: bold;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-height: 48vh;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }

        @media (min-width: 769px) {
            #controls {
                width: 320px;
                border-bottom-right-radius: 16px;
                display: block;
                max-height: 95vh;
                padding: 16px;
            }
            #controls div {
                margin-bottom: 12px;
                width: 100% !important;
            }
        }

        #controls h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #4CAF50;
            width: 100%;
        }

        .control-group {
            width: calc(50% - 6px);
            margin: 0;
        }

        .control-group-full {
            width: 100%;
            margin: 0;
        }

        label {
            font-size: 0.85rem;
            color: #ccc;
            display: block;
            margin-bottom: 3px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 7px 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 9px 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active, button:hover {
            background: #1976D2;
        }

        #instructions-text {
            font-size: 0.8rem;
            color: #bbb;
            margin-top: 4px;
        }

        #power-bar-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 6px;
        }

        #power-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4CAF50, #ffeb3b, #f44336);
            transition: width 0.05s linear;
        }

        /* Result Panel */
        #result-panel {
            pointer-events: auto;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 24px;
            border-radius: 14px;
            text-align: center;
            border: 2px solid #4CAF50;
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.6);
            z-index: 50;
            max-width: 90vw;
        }

        #result-panel.hidden {
            display: none;
        }

        #result-panel h3 {
            margin: 0 0 8px 0;
            color: #4CAF50;
            font-size: 1.4rem;
        }

        #result-text {
            font-size: 0.95rem;
            white-space: pre-line;
            margin: 8px 0;
            color: #e0e0e0;
        }

        #result-link {
            display: inline-block;
            margin: 10px 0;
            padding: 8px 18px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #reset-btn {
            background: #f44336;
            margin-top: 6px;
        }

        /* Mobile Shoot Button */
        #mobile-shoot-btn {
            position: absolute;
            bottom: 25px;
            right: 20px;
            width: 76px;
            height: 76px;
            background: radial-gradient(circle, #f44336 40%, #d32f2f 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            pointer-events: auto;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 40;
            cursor: pointer;
        }
        #mobile-shoot-btn:active {
            transform: scale(0.92);
            background: #b71c1c;
        }

        /* Map Modal Styles */
        #map-modal {
            pointer-events: auto;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 12px;
        }

        #map-modal.hidden {
            display: none;
        }

        #map-modal-content {
            background: #ffffff;
            padding: 16px;
            border-radius: 14px;
            width: 95%;
            max-width: 520px;
            max-height: 90vh;
            color: #222;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #map-modal-content h3 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
            color: #1976d2;
        }

        #map-modal-content p {
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            color: #666;
        }

        .map-quick-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .map-quick-btn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            width: auto;
            flex: 1;
            font-weight: 500;
        }

        .map-quick-btn:active {
            background: #ddd;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            max-height: 48vh;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }

        #leaflet-map {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #map-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border: 2px solid #f44336;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 0 6px rgba(244,67,54,0.6);
        }
        
        #map-crosshair::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f44336;
            font-size: 22px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 11px;
            font-size: 0.95rem;
            border-radius: 8px;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 2000;
        }
        #loading-overlay.hidden { display: none; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair">+</div>
        <div id="controls">
            <h2>地圖射飛鏢</h2>
            
            <div class="control-group-full">
                <button id="open-map-btn">📍 自訂地圖範圍</button>
            </div>
            
            <div class="control-group">
                <label>距離：</label>
                <select id="distance-select">
                    <option value="2.37">標準 (2.37m)</option>
                    <option value="5">5公尺</option>
                    <option value="10">10公尺</option>
                    <option value="custom">自訂...</option>
                </select>
            </div>

            <div class="control-group">
                <label>模式：</label>
                <select id="mode-select">
                    <option value="single">單發模式</option>
                    <option value="multi">三發區域模式</option>
                </select>
            </div>

            <div id="custom-distance-container" class="control-group-full" style="display: none;">
                <label>輸入自訂距離 (公尺)：</label>
                <input type="number" id="custom-distance-input" min="1" max="100" value="15">
            </div>

            <div class="control-group">
                <label>標靶移動：</label>
                <select id="movement-select">
                    <option value="none">靜止</option>
                    <option value="horizontal">左右移動</option>
                    <option value="vertical">上下移動</option>
                    <option value="circle">圓形移動</option>
                </select>
            </div>

            <div id="speed-container" class="control-group" style="display: none;">
                <label>速度：<span id="speed-display">1.0</span></label>
                <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1" style="width:100%;">
            </div>

            <div class="control-group-full">
                <div id="instructions-text">載入中...</div>
                <div id="power-bar-container">
                    <div id="power-bar"></div>
                </div>
            </div>
        </div>

        <div id="result-panel" class="hidden">
            <h3>射中位置！</h3>
            <p id="result-text"></p>
            <a id="result-link" href="#" target="_blank">在 Google Maps 中開啟</a>
            <button id="reset-btn">重新開始</button>
        </div>

        <div id="mobile-shoot-btn" style="display: none;">🎯 射擊</div>
    </div>

    <!-- Map Selection Modal -->
    <div id="map-modal" class="hidden">
        <div id="map-modal-content">
            <h3>選擇地圖標靶中心點</h3>
            <p>滑動縮放地圖，紅十字即為標靶中心：</p>
            <div class="map-quick-buttons">
                <button type="button" class="map-quick-btn" id="btn-locate-me">📍 我的位置</button>
                <button type="button" class="map-quick-btn" id="btn-ncu">🏫 中央大學</button>
                <button type="button" class="map-quick-btn" id="btn-taipei101">🏙️ 台北101</button>
            </div>
            <div id="map-wrapper">
                <div id="leaflet-map"></div>
                <div id="map-crosshair"></div>
            </div>
            <div class="modal-buttons">
                <button id="cancel-map-btn" style="background: #777;">取消</button>
                <button id="confirm-map-btn">確認選取並更新</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="hidden">下載地圖圖資中，請稍候...</div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    <script src="map_data.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        
        const initialMapBase64 = window.mapBase64;

        let scene, camera, renderer, clock;
        let world;
        let darts = [];
        let targetMesh, targetBody;
        let isMouseDown = false;
        let power = 0;
        const MAX_POWER = 50;
        let hitPoints = [];
        let gameMode = 'single';
        let currentDistance = 2.37;
        let leafletMap = null;
        let targetMovement = 'none';
        let targetSpeed = 1.0;

        const powerBar = document.getElementById('power-bar');
        const distanceSelect = document.getElementById('distance-select');
        const customDistanceContainer = document.getElementById('custom-distance-container');
        const customDistanceInput = document.getElementById('custom-distance-input');
        const modeSelect = document.getElementById('mode-select');
        const movementSelect = document.getElementById('movement-select');
        const speedContainer = document.getElementById('speed-container');
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const resultPanel = document.getElementById('result-panel');
        const resultText = document.getElementById('result-text');
        const resultLink = document.getElementById('result-link');
        const resetBtn = document.getElementById('reset-btn');
        const mapModal = document.getElementById('map-modal');
        const openMapBtn = document.getElementById('open-map-btn');
        const cancelMapBtn = document.getElementById('cancel-map-btn');
        const confirmMapBtn = document.getElementById('confirm-map-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const shootBtn = document.getElementById('mobile-shoot-btn');
        const instructionsText = document.getElementById('instructions-text');

        // 判斷是否為觸控設備 (手機 / 平板)
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 768);

        let mapBounds = {
            minLat: 24.965, maxLat: 24.971,
            minLng: 121.191, maxLng: 121.197
        };

        init();
        animate();

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            setCameraDistance(currentDistance);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            world = new CANNON.World({
                gravity: new CANNON.Vec3(0, -9.82, 0),
            });

            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            const floorBody = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Plane(),
            });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            createTarget();
            
            if (initialMapBase64) {
                const texture = new THREE.TextureLoader().load(initialMapBase64);
                texture.colorSpace = THREE.SRGBColorSpace;
                targetMesh.material.map = texture;
                targetMesh.material.needsUpdate = true;
            } else {
                updateTargetMap(24.9682, 121.1945, 16);
            }

            window.addEventListener('resize', onWindowResize);
            
            // 選單事件
            distanceSelect.addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    customDistanceContainer.style.display = 'block';
                    setCameraDistance(parseFloat(customDistanceInput.value));
                } else {
                    customDistanceContainer.style.display = 'none';
                    setCameraDistance(parseFloat(e.target.value));
                }
            });

            customDistanceInput.addEventListener('input', (e) => {
                if (distanceSelect.value === 'custom') {
                    const val = parseFloat(e.target.value);
                    if (!isNaN(val) && val > 0) setCameraDistance(val);
                }
            });

            modeSelect.addEventListener('change', (e) => { gameMode = e.target.value; resetGame(); });
            
            movementSelect.addEventListener('change', (e) => {
                targetMovement = e.target.value;
                if (targetMovement === 'none') {
                    speedContainer.style.display = 'none';
                    targetBody.position.set(0, 2, 0);
                    targetMesh.position.copy(targetBody.position);
                } else {
                    speedContainer.style.display = 'block';
                }
            });

            speedSlider.addEventListener('input', (e) => {
                targetSpeed = parseFloat(e.target.value);
                speedDisplay.innerText = targetSpeed.toFixed(1);
            });

            resetBtn.addEventListener('click', resetGame);

            // 操作模式分支：觸控 vs 滑鼠
            if (isTouchDevice) {
                instructionsText.innerText = "操作：滑動畫面瞄準，按住右下角按鈕蓄力射擊。";
                shootBtn.style.display = "flex";

                // 觸控發射按鈕
                shootBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (!resultPanel.classList.contains('hidden')) return;
                    isMouseDown = true;
                    power = 0;
                }, { passive: false });

                shootBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (!isMouseDown) return;
                    isMouseDown = false;
                    shootDart(power);
                    power = 0;
                    powerBar.style.width = '0%';
                }, { passive: false });

                // 觸控滑動瞄準
                let isDragging = false;
                let previousTouch = null;

                renderer.domElement.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        previousTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                }, { passive: false });

                renderer.domElement.addEventListener('touchmove', (e) => {
                    if (isDragging && e.touches.length === 1) {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const movementX = touch.clientX - previousTouch.x;
                        const movementY = touch.clientY - previousTouch.y;
                        
                        yaw -= movementX * 0.005;
                        pitch -= movementY * 0.005;
                        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                        
                        previousTouch = { x: touch.clientX, y: touch.clientY };
                    }
                }, { passive: false });

                renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

            } else {
                // 電腦滑鼠模式
                instructionsText.innerText = "操作：點擊畫面開始。移動滑鼠瞄準，按住左鍵蓄力，放開射出。";

                renderer.domElement.addEventListener('click', () => {
                    if (resultPanel.classList.contains('hidden') && mapModal.classList.contains('hidden')) {
                        renderer.domElement.requestPointerLock();
                    }
                });

                document.addEventListener('pointerlockchange', () => {
                    const isLocked = document.pointerLockElement === renderer.domElement;
                    if (!isLocked && isMouseDown) {
                        isMouseDown = false;
                        power = 0;
                        powerBar.style.width = '0%';
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (document.pointerLockElement === renderer.domElement) {
                        yaw -= e.movementX * 0.002;
                        pitch -= e.movementY * 0.002;
                        pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                    }
                });

                document.addEventListener('mousedown', (e) => {
                    if (document.pointerLockElement === renderer.domElement && e.button === 0) {
                        isMouseDown = true;
                        power = 0;
                    }
                });

                document.addEventListener('mouseup', (e) => {
                    if (document.pointerLockElement === renderer.domElement && e.button === 0 && isMouseDown) {
                        isMouseDown = false;
                        shootDart(power);
                        power = 0;
                        powerBar.style.width = '0%';
                    }
                });
            }

            // Map Modal 邏輯
            openMapBtn.addEventListener('click', () => {
                if (document.exitPointerLock) document.exitPointerLock();
                mapModal.classList.remove('hidden');
                if (!leafletMap) {
                    leafletMap = L.map('leaflet-map', {
                        zoomSnap: 1,
                        zoomDelta: 1
                    }).setView([24.9682, 121.1945], 16);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: 'Tiles &copy; Esri'
                    }).addTo(leafletMap);
                }
                setTimeout(() => leafletMap && leafletMap.invalidateSize(), 150);
                setTimeout(() => leafletMap && leafletMap.invalidateSize(), 350);
            });

            // 快捷地點按鈕
            const btnNCU = document.getElementById('btn-ncu');
            if (btnNCU) btnNCU.addEventListener('click', () => leafletMap && leafletMap.setView([24.9682, 121.1945], 16));

            const btn101 = document.getElementById('btn-taipei101');
            if (btn101) btn101.addEventListener('click', () => leafletMap && leafletMap.setView([25.0339, 121.5644], 16));

            const btnLocate = document.getElementById('btn-locate-me');
            if (btnLocate) btnLocate.addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        leafletMap && leafletMap.setView([pos.coords.latitude, pos.coords.longitude], 16);
                    }, () => {
                        alert('無法取得定位，請確認已允許位置權限。');
                    }, { enableHighAccuracy: true, timeout: 8000 });
                } else {
                    alert('瀏覽器不支援定位功能。');
                }
            });

            cancelMapBtn.addEventListener('click', () => {
                mapModal.classList.add('hidden');
            });

            confirmMapBtn.addEventListener('click', () => {
                mapModal.classList.add('hidden');
                const center = leafletMap.getCenter();
                const zoom = Math.round(leafletMap.getZoom());
                updateTargetMap(center.lat, center.lng, zoom);
                resetGame();
            });
        }

        function createTarget() {
            const targetSize = 3;
            const geometry = new THREE.PlaneGeometry(targetSize, targetSize);
            const material = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide });
            targetMesh = new THREE.Mesh(geometry, material);
            targetMesh.position.set(0, 2, 0);
            targetMesh.receiveShadow = true;
            scene.add(targetMesh);

            targetBody = new CANNON.Body({
                type: CANNON.Body.KINEMATIC,
                shape: new CANNON.Box(new CANNON.Vec3(targetSize/2, targetSize/2, 0.1)),
                position: new CANNON.Vec3(0, 2, 0)
            });
            world.addBody(targetBody);
        }

        function lon2tile(lon,zoom) { return (Math.floor((lon+180)/360*Math.pow(2,zoom))); }
        function lat2tile(lat,zoom) { return (Math.floor((1-Math.log(Math.tan(lat*Math.PI/180) + 1/Math.cos(lat*Math.PI/180))/Math.PI)/2 *Math.pow(2,zoom))); }
        function tile2lon(x,z) { return (x/Math.pow(2,z)*360-180); }
        function tile2lat(y,z) { 
            const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
            return (180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))));
        }

        async function updateTargetMap(centerLat, centerLng, zoom) {
            zoom = Math.round(zoom);
            loadingOverlay.classList.remove('hidden');
            try {
                const centerTileX = lon2tile(centerLng, zoom);
                const centerTileY = lat2tile(centerLat, zoom);
                
                const startX = centerTileX - 1;
                const startY = centerTileY - 1;
                
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                
                const promises = [];
                for(let i=0; i<4; i++) {
                    for(let j=0; j<4; j++) {
                        const x = startX + i;
                        const y = startY + j;
                        const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${zoom}/${y}/${x}`;
                        
                        promises.push(new Promise((resolve) => {
                            const img = new Image();
                            img.crossOrigin = 'Anonymous';
                            img.onload = () => {
                                ctx.drawImage(img, i*256, j*256, 256, 256);
                                resolve();
                            };
                            img.onerror = resolve;
                            img.src = url;
                        }));
                    }
                }
                
                await Promise.all(promises);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                targetMesh.material.map = texture;
                targetMesh.material.needsUpdate = true;
                
                mapBounds.maxLat = tile2lat(startY, zoom);
                mapBounds.minLat = tile2lat(startY + 4, zoom);
                mapBounds.minLng = tile2lon(startX, zoom);
                mapBounds.maxLng = tile2lon(startX + 4, zoom);
                
            } catch (e) {
                console.error("Failed to load map texture", e);
                alert("下載地圖失敗，請檢查網路連線。");
            }
            loadingOverlay.classList.add('hidden');
        }

        function setCameraDistance(distance) {
            currentDistance = distance;
            camera.position.set(0, 1.6, distance);
            camera.lookAt(0, 2, 0);
        }

        let pitch = 0;
        let yaw = 0;

        function shootDart(shootPower) {
            const geometry = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
            geometry.rotateX(Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const dartMesh = new THREE.Mesh(geometry, material);
            
            dartMesh.position.copy(camera.position);
            dartMesh.quaternion.copy(camera.quaternion);
            scene.add(dartMesh);

            const shape = new CANNON.Cylinder(0.02, 0.02, 0.2, 8);
            const dartBody = new CANNON.Body({
                mass: 0.1,
                position: new CANNON.Vec3(camera.position.x, camera.position.y, camera.position.z),
                shape: shape
            });
            
            dartBody.quaternion.copy(camera.quaternion);

            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            direction.normalize();

            const speed = 10 + (shootPower / MAX_POWER) * 20;
            dartBody.velocity.set(direction.x * speed, direction.y * speed, direction.z * speed);
            dartBody.angularVelocity.set(0, 0, 5);

            world.addBody(dartBody);
            darts.push({ mesh: dartMesh, body: dartBody, hasHit: false });
        }

        function calculateHitCoordinate(intersectionPoint) {
            targetMesh.updateMatrixWorld();
            const localPoint = targetMesh.worldToLocal(intersectionPoint.clone());
            const u = (localPoint.x + 1.5) / 3;
            const v = (localPoint.y + 1.5) / 3;
            
            const lat = mapBounds.minLat + (mapBounds.maxLat - mapBounds.minLat) * v;
            const lng = mapBounds.minLng + (mapBounds.maxLng - mapBounds.minLng) * u;
            return { lat, lng };
        }

        function showResult(coordsList) {
            if (document.exitPointerLock) document.exitPointerLock();
            resultPanel.classList.remove('hidden');
            
            if (gameMode === 'single') {
                const coord = coordsList[0];
                const url = `https://www.google.com/maps/search/?api=1&query=${coord.lat},${coord.lng}`;
                resultText.innerText = `經度: ${coord.lng.toFixed(5)}\n緯度: ${coord.lat.toFixed(5)}`;
                resultLink.href = url;
            } else {
                const centerLat = coordsList.reduce((sum, c) => sum + c.lat, 0) / 3;
                const centerLng = coordsList.reduce((sum, c) => sum + c.lng, 0) / 3;
                
                let text = "已形成區域！\n";
                coordsList.forEach((c, index) => {
                    text += `第 ${index + 1} 發: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}\n`;
                });
                text += `\n中心點:\n經度: ${centerLng.toFixed(5)}\n緯度: ${centerLat.toFixed(5)}`;
                
                resultText.innerText = text;
                
                const url = `https://www.google.com/maps/search/?api=1&query=${centerLat},${centerLng}`;
                resultLink.href = url;
            }
        }

        function resetGame() {
            darts.forEach(dart => {
                if (dart.mesh.parent) dart.mesh.parent.remove(dart.mesh);
                world.removeBody(dart.body);
            });
            darts = [];
            hitPoints = [];
            resultPanel.classList.add('hidden');
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (isMouseDown) {
                power = Math.min(power + 1, MAX_POWER);
                powerBar.style.width = `${(power / MAX_POWER) * 100}%`;
            }
            world.step(1 / 60);

            if (targetMovement !== 'none') {
                const amplitude = 1.2;
                let x = 0;
                let y = 2;
                if (targetMovement === 'horizontal') {
                    x = Math.sin(time * targetSpeed) * amplitude;
                } else if (targetMovement === 'vertical') {
                    y = 2 + Math.sin(time * targetSpeed) * amplitude;
                } else if (targetMovement === 'circle') {
                    x = Math.sin(time * targetSpeed) * amplitude;
                    y = 2 + Math.cos(time * targetSpeed) * amplitude;
                }
                targetBody.position.set(x, y, 0);
                targetMesh.position.copy(targetBody.position);
            }

            const raycaster = new THREE.Raycaster();
            darts.forEach(dart => {
                if (dart.hasHit) return;

                dart.mesh.position.copy(dart.body.position);
                dart.mesh.quaternion.copy(dart.body.quaternion);
                
                const direction = new THREE.Vector3().copy(dart.body.velocity).normalize();
                raycaster.set(dart.mesh.position, direction);
                
                const intersects = raycaster.intersectObject(targetMesh);
                if (intersects.length > 0 && intersects[0].distance < 0.3) {
                    dart.hasHit = true;
                    targetMesh.attach(dart.mesh);
                    dart.mesh.position.copy(targetMesh.worldToLocal(intersects[0].point.clone()));
                    world.removeBody(dart.body);
                    
                    const coords = calculateHitCoordinate(intersects[0].point);
                    hitPoints.push(coords);
                    
                    if (gameMode === 'single') {
                        showResult(hitPoints);
                    } else if (gameMode === 'multi' && hitPoints.length >= 3) {
                        showResult(hitPoints);
                    }
                }
                if (dart.mesh.position.y < 0) {
                    dart.hasHit = true;
                }
            });
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
